rif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0"># アップデート情報16.7→16.8</tspan><tspan x="0" dy="46.15px">## 強化</tspan><tspan x="0" dy="46.15px">・Sacred Teraの体力増加</tspan><tspan x="0" dy="46.15px">・Lightning Gigaの再生能力増加</tspan><tspan x="0" dy="46.15px">・LS pistolの重量減少</tspan><tspan x="0" dy="46.15px">・CS machinegunの弾丸サイズ増加</tspan><tspan x="0" dy="46.15px">・Matchlockの負傷付与確率増加</tspan><tspan x="0" dy="46.15px">・Mainspring rifleの重量減少、弾丸サイズ増加</tspan><tspan x="0" dy="46.15px">・Hexa SCのブレ減少、弾速上昇</tspan><tspan x="0" dy="46.15px">・Shot sniperのリロード速度増加</tspan><tspan x="0" dy="46.15px">・Rapid laserの代償減少、重量減少</tspan><tspan x="0" dy="46.15px">・Magic stoneの代償減少</tspan><tspan x="0" dy="46.15px">・Knight swordの構え時の視野増加</tspan><tspan x="0" dy="46.15px">・D shotgunのリロード速度増加</tspan><tspan x="0" dy="46.15px">・サブ全般の重量減少</tspan><tspan x="0" dy="46.15px">・JJ-100の重量減少</tspan><tspan x="0" dy="46.15px">・BS-000の重量減少</tspan><tspan x="0" dy="46.15px">・チーミングデバフの攻撃減少量が減少</tspan><tspan x="0" dy="46.15px">## 弱体化</tspan><tspan x="0" dy="46.15px">・Assault rifle, HE assault rifleの射程減少</tspan><tspan x="0" dy="46.15px">・Phantom harpの代償増加</tspan><tspan x="0" dy="46.15px">・Earth staffの重量増加</tspan><tspan x="0" dy="46.15px">## 調整</tspan><tspan x="0" dy="46.15px">・BP-080</tspan></text><path d="" fill="#feffbf" fill-rule="nonzero" stroke="#000000" stroke-width="0" stroke-linecap="butt" stroke-linejoin="miter"/><path d="" fill="url(#color-1)" fill-rule="nonzero" stroke="#000000" stroke-width="0" stroke-linecap="butt" stroke-linejoin="miter"/><path d="" fill="url(#color-2)" fill-rule="nonzero" stroke="#000000" stroke-width="0" stroke-linecap="butt" stroke-linejoin="miter"/><path d="" fill="url(#color-3)" fill-rule="nonzero" stroke="#000000" stroke-width="0" stroke-linecap="butt" stroke-linejoin="miter"/><path d="" fill="#e3e3e3" fill-rule="nonzero" stroke="#000000" stroke-width="0" stroke-linecap="butt" stroke-linejoin="miter"/><path d="" fill="#e3e3e3" fill-rule="nonzer